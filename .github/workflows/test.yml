name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Restore
        run: dotnet restore LinqPadCosmosDB.slnx

      - name: Build
        run: dotnet build LinqPadCosmosDB.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test LinqPadCosmosDB.Tests/LinqPadCosmosDB.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"